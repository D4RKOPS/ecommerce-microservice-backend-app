apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-discovery
  template:
    metadata:
      labels:
        app: service-discovery
    spec:
      containers:
      - name: service-discovery
        image: selimhorri/service-discovery-ecommerce-boot:0.1.0
        ports:
          - containerPort: 8761
        env:
          - name: SPRING_PROFILES_ACTIVE
            valueFrom:
              configMapKeyRef:
                name: common-config
                key: SPRING_PROFILES_ACTIVE
          - name: eureka.client.service-url.defaultZone
            valueFrom:
              configMapKeyRef:
                name: common-config
                key: EUREKA_URL
          - name: SPRING_CLOUD_CONFIG_URI
            valueFrom:
              configMapKeyRef:
                name: common-config
                key: CONFIG_SERVER_URL
          - name: spring.zipkin.base-url
            valueFrom:
              configMapKeyRef:
                name: common-config
                key: ZIPKIN_URL
