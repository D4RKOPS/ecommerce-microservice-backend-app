version: '3.8'
services:
  zipkin-container:
    container_name: zipkin-container
    image: openzipkin/zipkin
    ports:
      - ${ZIPKIN_PORT}:9411
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  service-discovery-container:
    container_name: service-discovery-container
    image: selimhorri/service-discovery-ecommerce-boot:0.1.0
    ports:
      - ${SERVICE_DISCOVERY_PORT}:8761
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
      
  cloud-config-container:
    container_name: cloud-config-container
    image: selimhorri/cloud-config-ecommerce-boot:0.1.0
    ports:
      - ${CONFIG_SERVER_PORT}:9296
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://service-discovery-container:8761/eureka/
    networks:
      - ecommerce-network
    depends_on:
      service-discovery-container:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9296/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
      
  api-gateway-container:
    container_name: api-gateway-container
    image: selimhorri/api-gateway-ecommerce-boot:0.1.0
    ports:
      - ${API_GATEWAY_PORT}:8080
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_CLOUD_CONFIG_URI=http://cloud-config-container:9296
      - SPRING_CLOUD_CONFIG_OVERRIDE_SYSTEM_PROPERTIES=false
      - eureka.client.service-url.defaultZone=http://service-discovery-container:8761/eureka/
      - spring.zipkin.base-url=http://zipkin-container:9411
    networks:
      - ecommerce-network
    depends_on:
      service-discovery-container:
        condition: service_healthy
      cloud-config-container:
        condition: service_healthy
      zipkin-container:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      
  proxy-client-container:
    container_name: proxy-client-container
    image: selimhorri/proxy-client-ecommerce-boot:0.1.0
    ports:
      - ${PROXY_CLIENT_PORT}:8900
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_CLOUD_CONFIG_URI=http://cloud-config-container:9296
      - SPRING_CLOUD_CONFIG_OVERRIDE_SYSTEM_PROPERTIES=false
      - eureka.client.service-url.defaultZone=http://service-discovery-container:8761/eureka/
      - spring.zipkin.base-url=http://zipkin-container:9411
    networks:
      - ecommerce-network
    depends_on:
      service-discovery-container:
        condition: service_healthy
      cloud-config-container:
        condition: service_healthy
      zipkin-container:
        condition: service_healthy
        
  order-service-container:
    container_name: order-service-container
    image: selimhorri/order-service-ecommerce-boot:0.1.0
    ports:
      - ${ORDERS_SERVICE_PORT}:8300
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_CLOUD_CONFIG_URI=http://cloud-config-container:9296
      - SPRING_CLOUD_CONFIG_OVERRIDE_SYSTEM_PROPERTIES=false
      - eureka.client.service-url.defaultZone=http://service-discovery-container:8761/eureka/
      - spring.zipkin.base-url=http://zipkin-container:9411
    networks:
      - ecommerce-network
    depends_on:
      service-discovery-container:
        condition: service_healthy
      cloud-config-container:
        condition: service_healthy
      zipkin-container:
        condition: service_healthy
        
  payment-service-container:
